services:
  app1:
    build: ./backend
    environment:
      SERVER_NAME: "server 1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - infra_network

  app2:
    build: ./backend
    environment:
      SERVER_NAME: "server 2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - infra_network

  app3:
    build: ./backend
    environment:
      SERVER_NAME: "server 3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - infra_network

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      app3:
        condition: service_healthy
    networks:
      - infra_network

#--------NGINX-EXPORTER---------#
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    command:
      - "--nginx.scrape-uri=http://nginx:8088/stub_status"
    depends_on:
      - nginx
    networks:
      - infra_network
#------------------------------#

#---------CAdvisor-------------#
  cadvisor:
    image: ghcr.io/google/cadvisor:${CADVISOR_TAG:-0.56.2}
    command:
      - "--housekeeping_interval=5s"
      - "--docker_only=true"
    ports:
      - "${CADVISOR_PORT:-8081}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /etc/machine-id:/etc/machine-id:ro
    privileged: true
    networks:
      - infra_network
#------------------------------#

#----------PROMETHEUS----------#
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - nginx-exporter
      - cadvisor
      - app1
      - app2
      - app3
    networks:
      - infra_network
#------------------------------#

#------------GRAFANA-----------#
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - infra_network
#------------------------------#

networks:
  infra_network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
